name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 编译
        run: |
          set +e
          xcodebuild -project PhotoSwipe.xcodeproj -scheme PhotoSwipe \
            -configuration Release -sdk iphoneos -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= CODE_SIGN_ENTITLEMENTS= \
            SWIFT_COMPILATION_MODE=singlefile \
            build > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            grep -E "error:" build.log | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "===== 最后 30 行 ====="
            tail -n 30 build.log
          fi
          exit $STATUS

      - name: 打包 IPA
        run: |
          rm -rf Payload PhotoSwipe.ipa
          mkdir -p Payload
          cp -R ./build/Build/Products/Release-iphoneos/PhotoSwipe.app Payload/
          zip -r -q PhotoSwipe.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSwipe-IPA
          path: PhotoSwipe.ipa
