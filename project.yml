name: PhotoSwipe

options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  PhotoSwipe:
    type: application
    platform: iOS
    sources:
      - path: PhotoSwipe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.photoswipe
        PRODUCT_NAME: PhotoSwipe
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "相册整理"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "需要读取你的照片，以便按截屏、实况、视频、自拍等分类整理。所有处理都在这台手机上完成，照片不会上传到任何地方。"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "需要访问相册，以便删除你确认清理的照片。"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIUserInterfaceStyle: "Dark"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_EMIT_LOC_STRINGS: "NO"

schemes:
  PhotoSwipe:
    build:
      targets:
        PhotoSwipe: all
    run:
      config: Release
    archive:
      config: Release
